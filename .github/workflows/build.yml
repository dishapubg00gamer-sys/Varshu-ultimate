name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          mkdir project_root
          unzip -o *.zip -d project_root
          ls -la project_root

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper and Build
        run: |
          # Project directory me move karein jahan build.gradle.kts hai
          BUILD_DIR=$(find project_root -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          cd "$BUILD_DIR"
          
          # Gradle wrapper generate karein kyunki zip me wrapper nahi tha
          gradle wrapper
          chmod +x gradlew
          
          # Debug APK build karein
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project_root/**/build/outputs/apk/debug/*.apk
