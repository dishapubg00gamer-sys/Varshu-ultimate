name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o *.zip -d extracted_project
          echo "Files inside extracted folder:"
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate gradlew and Build APK
        run: |
          # Dhoondho gradlew file kahan hai
          GRADLE_DIR=$(find extracted_project -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$GRADLE_DIR" ]; then
            echo "Error: gradlew file nahi mili zip ke andar!"
            exit 1
          fi
          echo "Gradle project found in: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          
