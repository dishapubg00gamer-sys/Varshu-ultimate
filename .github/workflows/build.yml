name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          mkdir -p project_root
          unzip -o *.zip -d project_root

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Fix Compatibility and Build APK
        run: |
          ROOT_DIR=$(find project_root -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$ROOT_DIR" ]; then
            ROOT_DIR="project_root"
          fi
          cd "$ROOT_DIR"
          
          # 1. Missing wrapper generate karein
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          
          # 2. JVM mismatch fix karne ke liye gradle.properties me validation disable karein
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          
          # 3. Build trigger karein
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project_root/**/build/outputs/apk/debug/*.apk
